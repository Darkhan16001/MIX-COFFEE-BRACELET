
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Админ — MIX COFFEE BRACELET</title>
  <link rel="stylesheet" href="style.css">

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script defer src="supabase-config.js"></script>
  <script defer src="supabase-client.js"></script>
  <script defer src="products.js"></script>
  <script defer src="admin.js"></script>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      ✦ MIX COFFEE BRACELET
    </a>

    <div class="top-actions">
      <a href="index.html" class="outline-button">
        Магазин
      </a>

      <button id="logout"
              class="outline-button"
              hidden>
        Выход
      </button>
    </div>
  </header>

  <main class="admin-wrap">
    <h1>Управление магазином</h1>
    <p>Товары сохраняются в Supabase.</p>

    <section class="admin-box"
             id="loginSection">

      <h2>Вход администратора</h2>

      <form id="loginForm">
        <label>
          Email
          <input id="email"
                 type="email"
                 autocomplete="username"
                 required>
        </label>

        <label>
          Пароль
          <input id="password"
                 type="password"
                 autocomplete="current-password"
                 required>
        </label>

        <button class="primary-button">
          Войти
        </button>
      </form>

      <p id="loginMessage"
         class="status"></p>
    </section>

    <div id="managerSection" hidden>

      <section class="admin-box">
        <h2>Браслеты</h2>

        <button id="addProduct"
                class="primary-button">
          + Добавить браслет
        </button>

        <button id="reloadProducts"
                class="outline-button">
          Обновить
        </button>

        <p id="listMessage"
           class="status"></p>

        <div class="product-list"
             id="productList"></div>
      </section>

      <section class="admin-box"
               id="editorSection"
               hidden>

        <h2 id="editorTitle">
          Новый браслет
        </h2>

        <form id="productForm">
          <div class="admin-grid">
            <label>
              Коллекция

              <select id="category">
                <option value="classic">
                  Coffee Classic
                </option>

                <option value="premium">
                  Coffee Premium
                </option>
              </select>
            </label>

            <label>
              Цена, ₸

              <input id="price"
                     type="number"
                     min="1"
                     value="3990"
                     required>
            </label>
          </div>

          <label>
            <input type="checkbox"
                   id="published"
                   checked>
            Показывать покупателям
          </label>

          <h3>Фотографии</h3>

          <p>
            Максимум 6 фото, каждое до 25 МБ.
            Форматы JPG, PNG, WEBP.
          </p>

          <input id="photoInput"
                 type="file"
                 accept="image/jpeg,image/png,image/webp"
                 multiple>

          <div class="photo-preview-list"
               id="photoList"></div>

          <p id="editorMessage"
             class="status"></p>

          <div class="top-actions">
            <button id="saveProduct"
                    type="submit"
                    class="primary-button">
              Сохранить браслет
            </button>

            <button id="cancelEdit"
                    type="button"
                    class="outline-button">
              Отмена
            </button>
          </div>
        </form>
      </section>

      <section class="admin-box">
        <h2>Обложки коллекций</h2>

        <div class="admin-grid">
          <div>
            <h3>Coffee Classic</h3>
            <div id="coverPreviewClassic"
                 class="cover-preview"></div>

            <input id="coverFileClassic"
                   type="file"
                   accept="image/jpeg,image/png,image/webp">

            <button id="saveCoverClassic"
                    class="outline-button">
              Сохранить обложку
            </button>

            <p id="coverStatusClassic"
               class="status"></p>
          </div>

          <div>
            <h3>Coffee Premium</h3>
            <div id="coverPreviewPremium"
                 class="cover-preview"></div>

            <input id="coverFilePremium"
                   type="file"
                   accept="image/jpeg,image/png,image/webp">

            <button id="saveCoverPremium"
                    class="outline-button">
              Сохранить обложку
            </button>

            <p id="coverStatusPremium"
               class="status"></p>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
