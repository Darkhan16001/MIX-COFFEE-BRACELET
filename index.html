<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap");

:root {
  --brown:#4a2c20;
  --gold:#b78b4d;
  --cream:#faf2e7;
  --white:#fffdf9;
  --muted:#8a6a54;

}

* { box-sizing:border-box }
html { scroll-behavior:smooth }
body {
  margin:0;
  background:var(--cream);
  color:var(--brown);
  font-family:"DM Sans",Arial,sans-serif;
}
button,select { font:inherit }
button { cursor:pointer }
button:disabled { opacity:.5;cursor:not-allowed }
a { text-decoration:none;color:inherit }
[hidden] { display:none!important }

header {
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

}

.hero {

}
.hero:after {
  content:"";
  position:absolute;
  inset:17px;
  border:1px solid #a8805166;
  pointer-events:none;
}
.glow {
  position:absolute;
  width:220px;
  height:220px;
  border-radius:50%;
  background:#fff2c6a6;
  filter:blur(50px);
  animation:float 7s ease-in-out infinite alternate;
}
.glow.one { top:0;left:0 }
.glow.two { right:0;bottom:0;animation-delay:-3s }
@keyframes float {
  to { transform:translateY(65px) }
}
.hero-content { position:relative;z-index:1 }

.center { text-align:center }

.collection {

}

}

.collection-info { padding:20px }

.products-head {

.tabs { display:flex;gap:10px;margin:22px 0 }

}

.outline {

#status {

.product {

}
.gallery {

}
.track {
  height:100%;
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  scrollbar-width:none;
}
.track::-webkit-scrollbar { display:none }
.slide {
  flex:0 0 100%;
  scroll-snap-align:start;
  display:grid;
  place-items:center;
}
.slide img {
  width:100%;
  height:100%;
  object-fit:contain;
}
.photo-error {
  padding:20px;
  text-align:center;
  color:#91735e;
}
.like {
  position:absolute;
  z-index:2;
  right:10px;

}
.like.active { color:#cb4258 }
.photo-count {
  position:absolute;
  bottom:10px;
  left:50%;

}
.product-info { padding:17px }
.product-info h3 {

}
.price { font-size:20px;font-weight:700 }
.product-info .primary { width:100% }
.empty {

  padding:38px;
  text-align:center;
  color:var(--muted);
  border-radius:15px;
}
.backdrop {
  position:fixed;
  z-index:30;
  inset:0;
  background:#23150eaa;
}
.cart {
  position:fixed;
  z-index:31;
  right:0;
  top:0;
  width:min(430px,100%);
  height:100dvh;
  padding:20px;
  background:#fffaf3;
  display:flex;
  flex-direction:column;
  transform:translateX(105%);

}
.cart.open { transform:translateX(0) }
.cart-head,.total {

  justify-content:space-between;

}
.cart-body { flex:1;overflow:auto }
.cart-row {

}
.cart-row img {

.cart-detail { flex:1 }
.qty {

.qty button { padding:6px 11px }
.cart-footer {

footer {

  color:#fff2df;
}
footer nav {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;

  margin:20px 0;
}

@media(max-width:750px) {
  .collections { grid-template-columns:1fr }
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)) }
  .cover { height:250px }
}
@media(max-width:440px) {
  header { padding:12px }
  .brand { font-size:11px }
  .actions button { padding:8px }
  .grid { grid-template-columns:1fr }
  .section { padding:45px 15px }
  .hero { min-height:490px }
  .hero-sub { letter-spacing:3px }
}
@media(prefers-reduced-motion:reduce) {
  .glow { animation:none }
}
</style>
</head>

<script>
"use strict";

/* SUPABASE — ПРЯМОЙ REST API.
   SDK и сторонние CDN не требуются. */

const SUPABASE_URL =
  "https://zvancvqgwsqzrqestovd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ixGxOe65UcmtWQHW2Bxh5w_qZepizp2";

const WHATSAPP = "77058038122";
const $ = id => document.getElementById(id);

const texts = {
  ru:{
    tagline:"Отборные кофейные зёрна 🤎",
    explore:"Смотреть коллекции",
    collections:"Наши коллекции",
    view:"Смотреть браслеты",
    add:"В корзину",
    cart:"Корзина",
    fav:"Избранное",
    empty:"Пока нет опубликованных браслетов.",
    emptyFav:"В избранном пока пусто.",
    loading:"Загружаем браслеты...",
    error:"Ошибка загрузки",
    total:"Итого",
    order:"Заказать через WhatsApp",
    copy:"Скопировать заказ",
    copied:"Заказ скопирован"
  },
  kz:{
    tagline:"Іріктелген кофе дәндері 🤎",
    explore:"Коллекцияны көру",
    collections:"Біздің коллекциялар",
    view:"Білезіктерді көру",
    add:"Себетке қосу",
    cart:"Себет",
    fav:"Таңдаулылар",
    empty:"Әзірге білезіктер жарияланбаған.",
    emptyFav:"Таңдаулы тауарлар жоқ.",
    loading:"Білезіктер жүктелуде...",
    error:"Жүктеу қатесі",
    total:"Жалпы сома",
    order:"WhatsApp арқылы тапсырыс беру",
    copy:"Тапсырысты көшіру",
    copied:"Тапсырыс көшірілді"
  },
  en:{
    tagline:"Carefully Selected Coffee Beans 🤎",
    explore:"Explore collections",
    collections:"Our collections",
    view:"View bracelets",
    add:"Add to cart",
    cart:"Cart",
    fav:"Favorites",
    empty:"No published bracelets yet.",
    emptyFav:"No favorites yet.",
    loading:"Loading bracelets...",
    error:"Loading error",
    total:"Total",
    order:"Order via WhatsApp",
    copy:"Copy order",
    copied:"Order copied"
  }
};

function readLocal(key,fallback) {
  try {
    return JSON.parse(localStorage.getItem(key)) ?? fallback;
  } catch {
    return fallback;
  }
}
function saveLocal(key,value) {
  try {
    localStorage.setItem(key,JSON.stringify(value));
  } catch {}
}

let lang=readLocal("mix-lang-v11","ru");
if (!texts[lang]) lang="ru";

let products=[];
let view="classic";
let loaded=false;
let busy=false;

let cart=readLocal("mix-cart-v11",[]);
if (!Array.isArray(cart)) cart=[];

const storedFav=readLocal("mix-fav-v11",[]);
let favorites=new Set(
  Array.isArray(storedFav)?storedFav:[]
);

const t=key=>texts[lang][key]||key;
const money=value=>
  Number(value).toLocaleString("ru-RU")+" ₸";

const productName=c=>
  c==="premium"?"Coffee Premium":"Coffee Classic";

const getProduct=id=>products.find(p=>p.id===id);

function photosOf(product) {
  return [...(product.bracelet_photos||[])]
    .filter(p=>p.image_url)
    .sort((a,b)=>
      Number(a.position||0)-Number(b.position||0)
    );
}

function saveCart() {
  saveLocal("mix-cart-v11",cart);
}
function saveFav() {
  saveLocal("mix-fav-v11",[...favorites]);
}

function setStatus(text) {
  $("status").textContent=text;
}

/* ПОЛУЧЕНИЕ ПУБЛИЧНЫХ ДАННЫХ */

async function apiGet(table,params) {
  const url=new URL(
    SUPABASE_URL+"/rest/v1/"+table
  );

  Object.entries(params).forEach(([key,value])=>{
    url.searchParams.set(key,value);
  });

  const response=await fetch(url,{
    method:"GET",
    headers:{
      apikey:SUPABASE_KEY,
      Accept:"application/json"
    },
    cache:"no-store"
  });

  const raw=await response.text();
  let result;

  try {
    result=JSON.parse(raw);
  } catch {
    throw new Error(
      "Сервер вернул неправильный ответ: HTTP "+
      response.status
    );
  }

  if (!response.ok) {
    throw new Error(
      "Supabase HTTP "+response.status+": "+
      (result.message||result.error||raw)
    );
  }

  return result;
}

async function loadProducts() {
  if (busy) return;
  busy=true;
  $("reload").disabled=true;
  setStatus(t("loading"));

  try {
    const data=await apiGet("bracelets",{
      select:
        "id,category,price,published,created_at,"+
        "bracelet_photos(id,image_url,position)",
      published:"eq.true",
      order:"created_at.desc"
    });

    if (!Array.isArray(data)) {
      throw new Error("Supabase не вернул список товаров");
    }

    products=data.map(p=>({
      ...p,
      bracelet_photos:photosOf(p)
    }));

    const ids=new Set(products.map(p=>p.id));
    cart=cart.filter(item=>
      ids.has(item.id)&&
      Number.isInteger(item.quantity)&&
      item.quantity>0
    );
    favorites=new Set(
      [...favorites].filter(id=>ids.has(id))
    );

    saveCart();
    saveFav();

    loaded=true;
    setStatus("");
    renderProducts();
    renderCart();

  } catch(error) {
    console.error("MIX STORE:",error);
    loaded=false;
    setStatus(t("error")+": "+error.message);
    $("empty").hidden=true;
  } finally {
    busy=false;
    $("reload").disabled=false;
  }
}

async function loadCovers() {
  try {
    const covers=await apiGet("collection_covers",{
      select:"category,image_url"
    });

    for (const category of ["classic","premium"]) {
      const cover=covers.find(
        c=>c.category===category
      );
      if (!cover?.image_url) continue;

      const box=$(category+"Cover");
      const image=document.createElement("img");
      image.src=cover.image_url;
      image.alt=productName(category);
      image.onerror=()=>image.remove();

      box.replaceChildren(image);
    }
  } catch(error) {
    console.warn("Обложки:",error);
  }
}

/* ГАЛЕРЕЯ ФОТО */

function makeGallery(product) {
  const gallery=document.createElement("div");
  gallery.className="gallery";

  const track=document.createElement("div");
  track.className="track";

  const photos=photosOf(product);

  photos.forEach((photo,index)=>{
    const slide=document.createElement("div");
    slide.className="slide";

    const image=document.createElement("img");
    image.src=photo.image_url;
    image.alt=productName(product.category)+
      " — фото "+(index+1);
    image.loading=index===0?"eager":"lazy";

    image.onerror=()=>{
      const error=document.createElement("p");
      error.className="photo-error";
      error.textContent="Фото недоступно";
      image.replaceWith(error);
    };

    slide.append(image);
    track.append(slide);
  });

  if (!photos.length) {
    const noPhoto=document.createElement("p");
    noPhoto.className="photo-error";
    noPhoto.textContent="Нет фотографии";
    track.append(noPhoto);
  }

  gallery.append(track);

  if (photos.length>1) {
    const counter=document.createElement("span");
    counter.className="photo-count";
    counter.textContent="1 / "+photos.length;

    track.addEventListener("scroll",()=>{
      const number=Math.min(
        photos.length,
        Math.round(
          track.scrollLeft/(track.clientWidth||1)
        )+1
      );
      counter.textContent=number+" / "+photos.length;
    },{passive:true});

    gallery.append(counter);
  }

  const favorite=document.createElement("button");
  favorite.className="like";
  favorite.textContent=favorites.has(product.id)?"♥":"♡";
  favorite.classList.toggle(
    "active",favorites.has(product.id)
  );
  favorite.setAttribute("aria-label",t("fav"));

  favorite.onclick=()=>{
    if (favorites.has(product.id)) {
      favorites.delete(product.id);
    } else {
      favorites.add(product.id);
    }
    saveFav();
    renderProducts();
  };

  gallery.append(favorite);
  return gallery;
}

function createCard(product) {
  const card=document.createElement("article");
  card.className="product";

  card.append(makeGallery(product));

  const info=document.createElement("div");
  info.className="product-info";

  const heading=document.createElement("h3");
  heading.textContent=productName(product.category);

  const price=document.createElement("p");
  price.className="price";
  price.textContent=money(product.price);

  const add=document.createElement("button");
  add.className="primary";
  add.textContent=t("add");
  add.onclick=()=>addCart(product.id);

  info.append(heading,price,add);
  card.append(info);
  return card;
}

function renderProducts() {
  const grid=$("grid");
  grid.replaceChildren();

  $("productsTitle").textContent=view==="favorites"
    ?t("fav")
    :productName(view);

  $("tabs").hidden=view==="favorites";

  document.querySelectorAll("[data-tab]")
    .forEach(button=>button.classList.toggle(
      "active",
      button.dataset.tab===view
    ));

  const visible=products.filter(p=>
    view==="favorites"
      ?favorites.has(p.id)
      :p.category===view
  );

  visible.forEach(p=>grid.append(createCard(p)));

  $("productsCount").textContent=
    visible.length+" "+(
      lang==="kz"?"білезік":
      lang==="en"?"bracelets":"браслетов"
    );

  $("empty").hidden=!loaded||visible.length!==0;
  $("empty").textContent=view==="favorites"
    ?t("emptyFav"):t("empty");

  updateCounts();
}

function openCategory(category) {
  view=category;
  renderProducts();
  $("products").scrollIntoView({behavior:"smooth"});
}

/* КОРЗИНА */

function addCart(id) {
  const product=getProduct(id);
  if (!product) return;

  const existing=cart.find(x=>x.id===id);

  if (existing) {
    existing.quantity=Math.min(99,existing.quantity+1);
  } else {
    cart.push({id,quantity:1});
  }

  saveCart();
  renderCart();
  openCart();
}

function changeQty(id,amount) {
  const item=cart.find(x=>x.id===id);
  if (!item) return;

  item.quantity+=amount;

  if (item.quantity<=0) {
    cart=cart.filter(x=>x.id!==id);
  } else {
    item.quantity=Math.min(99,item.quantity);
  }

  saveCart();
  renderCart();
}

function total() {
  return cart.reduce((sum,item)=>{
    const p=getProduct(item.id);
    return sum+(p?p.price*item.quantity:0);
  },0);
}

function updateCounts() {
  $("favoritesCount").textContent=favorites.size;

  $("cartCount").textContent=cart.reduce(
    (sum,item)=>sum+item.quantity,0
  );
}

function orderText() {
  const lines=[
    "🤎 MIX COFFEE BRACELET",
    "Заказ / Тапсырыс",
    "-------------------"
  ];

  cart.forEach((item,index)=>{
    const product=getProduct(item.id);
    if (!product) return;

    lines.push(
      (index+1)+". "+productName(product.category),
      "Количество: "+item.quantity,
      "Цена: "+money(product.price*item.quantity)
    );

    const image=photosOf(product)[0];
    if (image) lines.push("Фото: "+image.image_url);

    lines.push("-------------------");
  });

  lines.push("Итого: "+money(total()));
  return lines.join("\n");
}

function renderCart() {
  const container=$("cartItems");
  container.replaceChildren();

  if (!cart.length) {
    const empty=document.createElement("p");
    empty.textContent=
      lang==="kz"?"Себет бос":
      lang==="en"?"Cart is empty":"Корзина пуста";
    container.append(empty);
  }

  for (const item of cart) {
    const product=getProduct(item.id);
    if (!product) continue;

    const row=document.createElement("div");
    row.className="cart-row";

    const image=document.createElement("img");
    image.src=photosOf(product)[0]?.image_url||"";
    image.alt=productName(product.category);

    const detail=document.createElement("div");
    detail.className="cart-detail";

    const heading=document.createElement("strong");
    heading.textContent=productName(product.category);

    const price=document.createElement("p");
    price.textContent=money(product.price*item.quantity);

    const qty=document.createElement("div");
    qty.className="qty";

    const minus=document.createElement("button");
    minus.textContent="−";
    minus.onclick=()=>changeQty(item.id,-1);

    const number=document.createElement("b");
    number.textContent=item.quantity;

    const plus=document.createElement("button");
    plus.textContent="+";
    plus.onclick=()=>changeQty(item.id,1);

    const remove=document.createElement("button");
    remove.textContent="×";
    remove.onclick=()=>changeQty(item.id,-item.quantity);

    qty.append(minus,number,plus,remove);
    detail.append(heading,price,qty);
    row.append(image,detail);
    container.append(row);
  }

  $("totalPrice").textContent=money(total());
  $("copyOrder").disabled=cart.length===0;

  const link=$("whatsappOrder");
  link.textContent=t("order");

  if (cart.length) {
    link.href="https://wa.me/"+WHATSAPP+
      "?text="+encodeURIComponent(orderText());
    link.style.opacity="1";
    link.style.pointerEvents="auto";
  } else {
    link.removeAttribute("href");
    link.style.opacity=".5";
    link.style.pointerEvents="none";
  }

  updateCounts();
}

function openCart() {
  $("backdrop").hidden=false;
  $("cartPanel").classList.add("open");
}

function closeCart() {
  $("backdrop").hidden=true;
  $("cartPanel").classList.remove("open");
}

/* ЯЗЫК */

function changeLanguage(next) {
  if (!texts[next]) return;

  lang=next;
  saveLocal("mix-lang-v11",lang);
  $("lang").value=lang;

  document.documentElement.lang=
    lang==="kz"?"kk":lang;

  $("tagline").textContent=t("tagline");
  $("explore").textContent=t("explore");
  $("collectionsTitle").textContent=t("collections");
  $("cartTitle").textContent=t("cart");
  $("totalLabel").textContent=t("total");
  $("copyOrder").textContent=t("copy");

  document.querySelectorAll(".viewLabel")
    .forEach(el=>el.textContent=t("view"));

  renderProducts();
  renderCart();
}

/* КНОПКИ */

$("lang").onchange=e=>changeLanguage(e.target.value);

$("explore").onclick=()=>{
  $("collections").scrollIntoView({
    behavior:"smooth"
  });
};

document.querySelectorAll("[data-category]")
  .forEach(button=>{
    button.onclick=()=>openCategory(
      button.dataset.category
    );
  });

document.querySelectorAll("[data-tab]")
  .forEach(button=>{
    button.onclick=()=>openCategory(
      button.dataset.tab
    );
  });

$("favoritesBtn").onclick=()=>openCategory("favorites");
$("cartBtn").onclick=openCart;
$("closeCart").onclick=closeCart;
$("backdrop").onclick=closeCart;
$("reload").onclick=loadProducts;

document.addEventListener("keydown",event=>{
  if (event.key==="Escape") closeCart();
});

$("copyOrder").onclick=async()=>{
  if (!cart.length) return;

  try {
    await navigator.clipboard.writeText(orderText());
    $("cartStatus").textContent=t("copied");
  } catch {
    $("cartStatus").textContent="Ошибка копирования";
  }
};

/* ЗАПУСК */

async function start() {
  $("year").textContent=new Date().getFullYear();
  changeLanguage(lang);

  await Promise.all([
    loadProducts(),
    loadCovers()
  ]);
}

start();
</script>

</body>
</html>
