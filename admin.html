
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIX COFFEE BRACELET — Администратор</title>
<style>
:root {
  --brown:#4a2c20;
  --cream:#f8f0e5;
  --line:#e5d3bd;
}
* { box-sizing:border-box }
body {
  margin:0;
  font-family:Arial,sans-serif;
  color:var(--brown);
  background:var(--cream);
}
[hidden] { display:none!important }
button,input,select { font:inherit }
button { cursor:pointer }
button:disabled { opacity:.5;cursor:not-allowed }
a { color:inherit;text-decoration:none }
header {
  padding:18px 5%;
  background:white;
  display:flex;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px solid var(--line);
}
main {
  max-width:1050px;
  padding:25px 16px 75px;
  margin:auto;
}
.panel {
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  margin:20px 0;
  padding:22px;
}
label { display:block;margin:13px 0;font-weight:600 }
input:not([type=checkbox]),select {
  display:block;
  width:100%;
  margin-top:8px;
  padding:13px;
  border:1px solid #cdb69d;
  border-radius:10px;
  background:white;
}
input[type=checkbox] {
  width:19px;height:19px;
  vertical-align:middle;
}
.primary,.outline {
  border-radius:11px;
  padding:12px 18px;
  margin:4px;
}
.primary {
  background:var(--brown);
  border:0;
  color:white;
}
.outline {
  background:white;
  border:1px solid #cbb59a;
  color:var(--brown);
}
.grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}
.card {
  background:#fffdf9;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px;
  min-width:0;
}
.card img {
  display:block;
  width:100%;
  height:155px;
  object-fit:contain;
  background:#f0e8df;
}
.card h3 { margin-bottom:6px }
.photos {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  margin:20px 0;
}
.photo {
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px;
}
.photo img {
  width:100%;
  height:125px;
  object-fit:contain;
}
.photo button {
  padding:6px 10px;
  margin:2px;
}
.two {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.status {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  color:#76523b;
}
.error { color:#aa2828 }
.preview img {
  max-width:100%;
  width:220px;
  height:170px;
  object-fit:contain;
}
@media(max-width:700px) {
  .grid { grid-template-columns:repeat(2,1fr) }
  .two { grid-template-columns:1fr }
}
@media(max-width:440px) {
  .grid { grid-template-columns:1fr }
  .photos { grid-template-columns:repeat(2,1fr) }
  .panel { padding:16px }
}
</style>
</head>

<body>
<header>
  <strong>✦ MIX COFFEE BRACELET</strong>
  <a href="./index.html">← Магазин</a>
</header>

<main>
<h1>Панель продавца</h1>

<p id="connection" class="status">
  Подключаемся к Supabase...
</p>

<section class="panel" id="loginSection">
  <h2>Вход администратора</h2>
  <form id="loginForm">
    <label>Email
      <input id="email" type="email" required>
    </label>
    <label>Пароль
      <input id="password" type="password" required>
    </label>
    <button class="primary">Войти</button>
  </form>
  <p id="loginStatus" class="status"></p>
</section>

<div id="manager" hidden>
  <button class="outline" id="logout">Выйти</button>

  <section class="panel">
    <h2>Браслеты</h2>
    <button class="primary" id="addProduct">
      + Добавить браслет
    </button>
    <button class="outline" id="refresh">
      Обновить
    </button>

    <p id="listStatus" class="status"></p>
    <div class="grid" id="productList"></div>
  </section>

  <section class="panel" id="editor" hidden>
    <h2 id="editorTitle">Новый браслет</h2>

    <form id="productForm">
      <div class="two">
        <label>Коллекция
          <select id="category">
            <option value="classic">Coffee Classic</option>
            <option value="premium">Coffee Premium</option>
          </select>
        </label>

        <label>Цена ₸
          <input id="price" type="number"
                 min="1" value="3990" required>
        </label>
      </div>

      <label>
        <input id="published" type="checkbox" checked>
        Показывать покупателям
      </label>

      <h3>Фотографии</h3>
      <p>До 6 фото на браслет, каждое до 25 МБ.</p>

      <input id="photoInput"
             type="file"
             multiple
             accept="image/jpeg,image/png,image/webp">

      <div id="photoList" class="photos"></div>
      <p id="editorStatus" class="status"></p>

      <button class="primary" id="saveProduct">
        Сохранить браслет
      </button>
      <button class="outline" type="button"
              id="cancelEdit">
        Отмена
      </button>
    </form>
  </section>

  <section class="panel">
    <h2>Обложки коллекций</h2>
    <div class="two">
      <div>
        <h3>Classic</h3>
        <div id="previewClassic" class="preview"></div>
        <input id="fileClassic" type="file"
               accept="image/jpeg,image/png,image/webp">
        <button id="saveClassic" class="outline">
          Сохранить Classic
        </button>
        <p id="statusClassic" class="status"></p>
      </div>

      <div>
        <h3>Premium</h3>
        <div id="previewPremium" class="preview"></div>
        <input id="filePremium" type="file"
               accept="image/jpeg,image/png,image/webp">
        <button id="savePremium" class="outline">
          Сохранить Premium
        </button>
        <p id="statusPremium" class="status"></p>
      </div>
    </div>
  </section>
</div>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);
const URL_PROJECT =
  "https://zvancvqgwsqzrqestovd.supabase.co";
const PUBLIC_KEY =
  "sb_publishable_ixGxOe65UcmtWQHW2Bxh5w_qZepizp2";
const BUCKET = "bracelet-photos";
const MAX_PHOTOS = 6;
const MAX_BYTES = 25 * 1024 * 1024;

let db = null;
let products = [];
let currentProduct = null;
let photos = [];
let saving = false;
let staff = false;

function status(id,text,error=false) {
  const el=$(id);
  el.textContent=text;
  el.className="status"+(error?" error":"");
}

function money(n) {
  return Number(n).toLocaleString("ru-RU")+" ₸";
}

function categoryName(c) {
  return c==="premium"?"Coffee Premium":"Coffee Classic";
}

function photoSort(list) {
  return [...(list||[])].sort(
    (a,b)=>(a.position??0)-(b.position??0)
  );
}

function validate(file) {
  if (!["image/jpeg","image/png","image/webp"]
    .includes(file.type)) {
    throw new Error(
      file.name+": поддерживаются только JPG, PNG и WEBP"
    );
  }
  if (!file.size || file.size>MAX_BYTES) {
    throw new Error(
      file.name+": размер должен быть до 25 МБ"
    );
  }
}

function ext(file) {
  if (file.type==="image/png") return "png";
  if (file.type==="image/webp") return "webp";
  return "jpg";
}

/* ЗАГРУЗКА БИБЛИОТЕКИ С РЕЗЕРВОМ */

function loadScript(url) {
  return new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src=url;
    script.onload=resolve;
    script.onerror=()=>{
      script.remove();
      reject(new Error("CDN недоступен: "+url));
    };
    document.head.appendChild(script);
  });
}

async function loadSupabaseLibrary() {
  const sources=[
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
    "https://unpkg.com/@supabase/supabase-js@2"
  ];

  for (const source of sources) {
    try {
      if (!window.supabase?.createClient) {
        await loadScript(source);
      }
      if (window.supabase?.createClient) return;
    } catch(error) {
      console.warn(error.message);
    }
  }

  throw new Error(
    "Не удалось загрузить Supabase с двух CDN. "+
    "Проверь интернет и блокировку скриптов."
  );
}

async function init() {
  await loadSupabaseLibrary();

  db=window.supabase.createClient(
    URL_PROJECT,
    PUBLIC_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true
      }
    }
  );

  status("connection","Supabase подключён");
}

/* ПРОВЕРКА ПРАВ ПРОДАВЦА */

async function checkStaff() {
  const {data,error}=await db.auth.getUser();
  if (error || !data?.user) return false;

  const result=await db.rpc("is_staff",{
    uid:data.user.id
  });

  if (result.error) {
    console.error(result.error);
    return false;
  }

  return result.data===true;
}

async function showAdmin() {
  staff=await checkStaff();

  $("loginSection").hidden=staff;
  $("manager").hidden=!staff;

  if (staff) {
    await Promise.all([
      loadProducts(),
      loadCovers()
    ]);
  }
}

$("loginForm").onsubmit=async event=>{
  event.preventDefault();
  status("loginStatus","Проверяем вход...");

  const {error}=await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });

  if (error) {
    status("loginStatus",error.message,true);
    return;
  }

  if (!(await checkStaff())) {
    await db.auth.signOut();
    status(
      "loginStatus",
      "У этого аккаунта нет прав продавца",
      true
    );
    return;
  }

  $("password").value="";
  await showAdmin();
};

$("logout").onclick=async()=>{
  await db.auth.signOut();
  closeEditor();
  await showAdmin();
};

/* ЗАГРУЗКА ТОВАРОВ */

async function loadProducts() {
  status("listStatus","Загрузка товаров...");

  const {data,error}=await db
    .from("bracelets")
    .select(`
      id,category,price,published,created_at,
      bracelet_photos(id,image_url,storage_path,position)
    `)
    .order("created_at",{ascending:false});

  if (error) {
    status("listStatus",error.message,true);
    return;
  }

  products=(data||[]).map(p=>({
    ...p,
    bracelet_photos:photoSort(p.bracelet_photos)
  }));

  renderProducts();
  status("listStatus","Всего товаров: "+products.length);
}

function renderProducts() {
  const list=$("productList");
  list.replaceChildren();

  products.forEach(product=>{
    const card=document.createElement("article");
    card.className="card";

    const image=document.createElement("img");
    image.src=product.bracelet_photos[0]?.image_url||"";
    image.alt=categoryName(product.category);

    const title=document.createElement("h3");
    title.textContent=categoryName(product.category);

    const price=document.createElement("p");
    price.textContent=money(product.price);

    const count=document.createElement("p");
    count.textContent=
      product.bracelet_photos.length+" фото";

    const published=document.createElement("p");
    published.textContent=product.published
      ?"Опубликован":"Скрыт";

    const edit=document.createElement("button");
    edit.className="outline";
    edit.textContent="✏️ Изменить";
    edit.onclick=()=>openEditor(product);

    const toggle=document.createElement("button");
    toggle.className="outline";
    toggle.textContent=product.published
      ?"Скрыть":"Опубликовать";

    toggle.onclick=async()=>{
      if (!confirm("Изменить публикацию товара?")) return;
      toggle.disabled=true;

      const {error}=await db
        .from("bracelets")
        .update({published:!product.published})
        .eq("id",product.id);

      if (error) {
        alert(error.message);
        toggle.disabled=false;
        return;
      }

      await loadProducts();
    };

    card.append(
      image,title,price,count,published,edit,toggle
    );
    list.append(card);
  });
}

/* РЕДАКТОР ТОВАРОВ */

function closeEditor() {
  photos.forEach(p=>{
    if (p.preview) URL.revokeObjectURL(p.preview);
  });
  photos=[];
  currentProduct=null;
  $("editor").hidden=true;
}

function openEditor(product=null) {
  closeEditor();
  currentProduct=product;

  photos=(product?.bracelet_photos||[]).map(p=>({
    ...p,
    kind:"existing"
  }));

  $("editorTitle").textContent=product
    ?"Редактировать браслет"
    :"Новый браслет";

  $("category").value=product?.category||"classic";
  $("price").value=product?.price||3990;
  $("published").checked=product?.published??true;
  $("photoInput").value="";

  status("editorStatus","");
  $("editor").hidden=false;
  renderPhotos();

  $("editor").scrollIntoView({behavior:"smooth"});
}

$("addProduct").onclick=()=>openEditor();
$("cancelEdit").onclick=closeEditor;
$("refresh").onclick=loadProducts;

$("category").onchange=()=>{
  if (currentProduct) return;
  $("price").value=$("category").value==="premium"
    ?5990:3990;
};

$("photoInput").onchange=event=>{
  const errors=[];
  let added=0;

  for (const file of [...event.target.files]) {
    if (photos.length>=MAX_PHOTOS) {
      errors.push("Максимум 6 фотографий");
      break;
    }

    try {
      validate(file);

      photos.push({
        kind:"new",
        file,
        preview:URL.createObjectURL(file)
      });
      added++;
    } catch(error) {
      errors.push(error.message);
    }
  }

  event.target.value="";
  renderPhotos();

  status(
    "editorStatus",
    "Добавлено: "+added+
    ". Всего: "+photos.length+"/6"+
    (errors.length?"\n"+errors.join("\n"):""),
    errors.length>0
  );
};

function movePhoto(index,step) {
  const next=index+step;
  if (next<0||next>=photos.length) return;

  [photos[index],photos[next]]=
    [photos[next],photos[index]];

  renderPhotos();
}

function renderPhotos() {
  const list=$("photoList");
  list.replaceChildren();

  photos.forEach((photo,index)=>{
    const card=document.createElement("div");
    card.className="photo";

    const image=document.createElement("img");
    image.src=photo.preview||photo.image_url;

    const label=document.createElement("p");
    label.textContent=index===0
      ?"Главное фото"
      :"Фото "+(index+1);

    const left=document.createElement("button");
    left.type="button";
    left.textContent="←";
    left.disabled=index===0;
    left.onclick=()=>movePhoto(index,-1);

    const right=document.createElement("button");
    right.type="button";
    right.textContent="→";
    right.disabled=index===photos.length-1;
    right.onclick=()=>movePhoto(index,1);

    const remove=document.createElement("button");
    remove.type="button";
    remove.textContent="×";
    remove.onclick=()=>{
      if (photo.preview) {
        URL.revokeObjectURL(photo.preview);
      }
      photos.splice(index,1);
      renderPhotos();
    };

    card.append(image,label,left,right,remove);
    list.append(card);
  });
}

/* SUPABASE STORAGE */

async function uploadFile(file,folder) {
  validate(file);

  const path=folder+"/"+crypto.randomUUID()+
    "."+ext(file);

  const {error}=await db.storage
    .from(BUCKET)
    .upload(path,file,{
      contentType:file.type,
      upsert:false
    });

  if (error) throw new Error(
    "Ошибка фото "+file.name+": "+error.message
  );

  const {data}=db.storage
    .from(BUCKET)
    .getPublicUrl(path);

  return {
    image_url:data.publicUrl,
    storage_path:path
  };
}

/* СОХРАНЕНИЕ ТОВАРА */

$("productForm").onsubmit=async event=>{
  event.preventDefault();
  if (saving) return;

  if (!(await checkStaff())) {
    status("editorStatus","Нет прав продавца",true);
    return;
  }

  if (!photos.length||photos.length>MAX_PHOTOS) {
    status(
      "editorStatus",
      "Нужно от 1 до 6 фотографий",
      true
    );
    return;
  }

  const price=Number($("price").value);

  if (!Number.isInteger(price)||price<=0) {
    status("editorStatus","Неверная цена",true);
    return;
  }

  saving=true;
  $("saveProduct").disabled=true;

  const category=$("category").value;
  const published=$("published").checked;
  let id=currentProduct?.id;

  const uploadedPaths=[];
  let recordsChanged=false;

  try {
    const prepared=[];

    // Загружаем новые фотографии,
    // не изменяя существующий товар.
    for (let i=0;i<photos.length;i++) {
      const photo=photos[i];

      if (photo.kind==="existing") {
        prepared.push({...photo});
        continue;
      }

      status(
        "editorStatus",
        "Загрузка фото "+(i+1)+
        " из "+photos.length+"..."
      );

      const result=await uploadFile(
        photo.file,"products"
      );

      uploadedPaths.push(result.storage_path);
      prepared.push({
        kind:"new",
        ...result
      });
    }

    status("editorStatus","Сохраняем в базе...");

    if (!id) {
      const {data,error}=await db
        .from("bracelets")
        .insert({
          category,
          price,
          published:false
        })
        .select("id")
        .single();

      if (error) throw error;
      id=data.id;
      recordsChanged=true;
    }

    const newPhotos=prepared.filter(
      p=>p.kind==="new"
    );

    if (newPhotos.length) {
      const {error}=await db
        .from("bracelet_photos")
        .insert(
          newPhotos.map((p,index)=>({
            bracelet_id:id,
            image_url:p.image_url,
            storage_path:p.storage_path,
            position:1000+index
          }))
        );

      if (error) throw error;
      recordsChanged=true;
    }

    const {data:stored,error:readError}=await db
      .from("bracelet_photos")
      .select("id,storage_path")
      .eq("bracelet_id",id);

    if (readError) throw readError;

    const idsByPath=new Map(
      (stored||[]).map(p=>[
        p.storage_path,p.id
      ])
    );

    for (let i=0;i<prepared.length;i++) {
      const photo=prepared[i];

      const photoId=photo.kind==="existing"
        ?photo.id
        :idsByPath.get(photo.storage_path);

      if (!photoId) {
        throw new Error(
          "Не найдено фото "+(i+1)
        );
      }

      const {error}=await db
        .from("bracelet_photos")
        .update({position:i})
        .eq("id",photoId);

      if (error) throw error;
      recordsChanged=true;
    }

    const retained=new Set(
      prepared
        .filter(p=>p.kind==="existing")
        .map(p=>p.id)
    );

    for (const old of currentProduct?.bracelet_photos||[]) {
      if (retained.has(old.id)) continue;

      const {error}=await db
        .from("bracelet_photos")
        .delete()
        .eq("id",old.id);

      if (error) throw error;
      recordsChanged=true;
    }

    const {error:saveError}=await db
      .from("bracelets")
      .update({
        category,
        price,
        published
      })
      .eq("id",id);

    if (saveError) throw saveError;
    recordsChanged=true;

    closeEditor();
    await loadProducts();

    status("listStatus","Браслет сохранён!");

  } catch(error) {
    console.error(error);

    if (!recordsChanged&&uploadedPaths.length) {
      const {error:cleanupError}=await db.storage
        .from(BUCKET)
        .remove(uploadedPaths);

      if (cleanupError) console.warn(cleanupError);
    }

    status(
      "editorStatus",
      "Ошибка: "+error.message+
      "\nПроверь товар перед повторным сохранением.",
      true
    );
  } finally {
    saving=false;
    $("saveProduct").disabled=false;
  }
};

/* ОБЛОЖКИ */

async function loadCovers() {
  const {data,error}=await db
    .from("collection_covers")
    .select("category,image_url");

  if (error) {
    console.error(error);
    return;
  }

  for (const category of ["classic","premium"]) {
    const suffix=category==="classic"
      ?"Classic":"Premium";

    const container=$("preview"+suffix);
    const cover=(data||[]).find(
      p=>p.category===category
    );

    container.replaceChildren();

    if (!cover?.image_url) {
      container.textContent="Нет обложки";
      continue;
    }

    const image=document.createElement("img");
    image.src=cover.image_url;
    image.alt=categoryName(category);
    container.append(image);
  }
}

async function saveCover(category) {
  if (!(await checkStaff())) return;

  const suffix=category==="classic"
    ?"Classic":"Premium";

  const input=$("file"+suffix);
  const button=$("save"+suffix);
  const file=input.files[0];

  if (!file) {
    status("status"+suffix,"Выбери фотографию",true);
    return;
  }

  button.disabled=true;
  let uploaded=null;

  try {
    uploaded=await uploadFile(file,"covers");

    const {error}=await db
      .from("collection_covers")
      .upsert({
        category,
        image_url:uploaded.image_url,
        storage_path:uploaded.storage_path,
        updated_at:new Date().toISOString()
      },{onConflict:"category"});

    if (error) throw error;

    input.value="";
    await loadCovers();

    status("status"+suffix,"Обложка сохранена!");

  } catch(error) {
    if (uploaded?.storage_path) {
      const {error:cleanupError}=await db.storage
        .from(BUCKET)
        .remove([uploaded.storage_path]);

      if (cleanupError) console.warn(cleanupError);
    }

    status("status"+suffix,error.message,true);
  } finally {
    button.disabled=false;
  }
}

$("saveClassic").onclick=()=>saveCover("classic");
$("savePremium").onclick=()=>saveCover("premium");

/* ЗАПУСК */

async function start() {
  try {
    await init();
    await showAdmin();
  } catch(error) {
    console.error(error);
    status("connection",error.message,true);
  }
}

start();
